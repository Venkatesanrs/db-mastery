version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: dbmastery-postgres
    environment:
      POSTGRES_DB: dbmastery
      POSTGRES_USER: dbmastery
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
